name: FastAPI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path:
            requirements.txt

      - name: Install dependencies
        run:
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python3 -m pytest -v

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download repo
        uses: actions/checkout@7

      - name: Upload tested application
        uses: actions/checkout@7
        with:
          name: fastapi-service
          path:
            application.py
            requirements.txt
            README.md
          retention-days: 7

